<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Counter App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <main class="w-full max-w-md bg-slate-800 rounded-3xl p-8 shadow-2xl border border-slate-700/50 flex flex-col items-center space-y-8">
        <!-- Header -->
        <header class="text-center">
            <h1 class="text-2xl font-semibold text-slate-300">Simple Counter</h1>
            <p class="text-sm text-slate-400 mt-1">Click the buttons or use keyboard (+ / -)</p>
        </header>

        <!-- Count Display -->
        <div class="relative flex items-center justify-center w-full py-8 bg-slate-900/60 rounded-2xl border border-slate-700/30">
            <span id="counter-value" class="text-7xl font-extrabold text-indigo-400 transition-all duration-150 select-none">
                0
            </span>
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center justify-between w-full gap-3">
            <!-- Decrement Button -->
            <button id="btn-decrement" aria-label="Decrement count" class="flex-1 py-4 bg-slate-700 hover:bg-slate-600 active:scale-95 text-xl font-bold rounded-xl transition-all duration-150 border border-slate-600/50 shadow-md focus:outline-none focus:ring-2 focus:ring-rose-500/50 flex items-center justify-center gap-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4" />
                </svg>
            </button>

            <!-- Reset Button -->
            <button id="btn-reset" aria-label="Reset count" class="px-5 py-4 bg-slate-700/50 hover:bg-slate-700 active:scale-95 text-sm font-semibold text-slate-400 hover:text-slate-200 rounded-xl transition-all duration-150 border border-slate-600/30 focus:outline-none focus:ring-2 focus:ring-amber-500/50">
                Reset
            </button>

            <!-- Increment Button -->
            <button id="btn-increment" aria-label="Increment count" class="flex-1 py-4 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-xl font-bold text-white rounded-xl transition-all duration-150 shadow-lg shadow-indigo-600/30 border border-indigo-500/50 focus:outline-none focus:ring-2 focus:ring-indigo-400/50 flex items-center justify-center gap-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
                </svg>
            </button>
        </div>
    </main>

    <script>
        // State variables
        let count = 0;

        // DOM elements
        const counterValueEl = document.getElementById('counter-value');
        const btnIncrement = document.getElementById('btn-increment');
        const btnDecrement = document.getElementById('btn-decrement');
        const btnReset = document.getElementById('btn-reset');

        // Helper function to update the counter DOM and trigger animations
        function updateCounter(newValue) {
            count = newValue;
            counterValueEl.textContent = count;

            // Simple visual pop animation
            counterValueEl.classList.remove('scale-110');
            void counterValueEl.offsetWidth; // Trigger reflow
            counterValueEl.classList.add('scale-110');
            setTimeout(() => {
                counterValueEl.classList.remove('scale-110');
            }, 100);
        }

        // Event listeners for UI buttons
        btnIncrement.addEventListener('click', () => {
            updateCounter(count + 1);
        });

        btnDecrement.addEventListener('click', () => {
            updateCounter(count - 1);
        });

        btnReset.addEventListener('click', () => {
            updateCounter(0);
        });

        // Keyboard shortcuts (+ / - / Arrow keys / Escape to reset)
        document.addEventListener('keydown', (e) => {
            if (e.key === '+' || e.key === '=' || e.key === 'ArrowUp' || e.key === 'ArrowRight') {
                updateCounter(count + 1);
            } else if (e.key === '-' || e.key === '_' || e.key === 'ArrowDown' || e.key === 'ArrowLeft') {
                updateCounter(count - 1);
            } else if (e.key === 'r' || e.key === 'R' || e.key === 'Escape') {
                updateCounter(0);
            }
        });
    </script>
</body>
</html>
